kind = "web"
previewPath = "/"
title = "OpsMind AI"
description = "An enterprise operations intelligence workspace that turns documents into tasks, tracks risks and decisions, and answers questions with evidence-backed context. Includes an end-to-end guided demo using realistic, locally persisted sample data."
version = "1.0.0"
id = "artifacts/ops-mind-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22495

[services.development]
run = "pnpm --filter @workspace/ops-mind-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ops-mind-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/ops-mind-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22495"
BASE_PATH = "/"
