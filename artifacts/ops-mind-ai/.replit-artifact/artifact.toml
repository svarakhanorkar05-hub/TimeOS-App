kind = "web"
previewPath = "/"
title = "TimeOS — Student Edition"
description = "A student-first AI time planner that turns lectures, assignments, energy and personal plans into an adaptive schedule while protecting focus and rest."
version = "1.0.0"
id = "artifacts/ops-mind-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22495

[services.development]
run = "pnpm --filter @workspace/ops-mind-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ops-mind-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/ops-mind-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22495"
BASE_PATH = "/"
